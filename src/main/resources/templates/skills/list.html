<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments/header :: head('技能列表 - 技能管理系统')}"></head>
<body class="d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>
    
    <main class="flex-shrink-0">
        <div class="container mt-4">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-list-ul"></i> 技能列表</h2>
                <a th:href="@{/skills/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle-fill"></i> 添加新技能
                </a>
            </div>
            
            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <!-- Search and Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/skills}" method="get" class="row g-3">
                        <div class="col-md-5">
                            <label for="keyword" class="form-label">搜索关键字</label>
                            <input type="text" class="form-control" id="keyword" name="keyword" 
                                   th:value="${keyword}" placeholder="输入技能名称、描述或分类">
                        </div>
                        <div class="col-md-4">
                            <label for="category" class="form-label">分类筛选</label>
                            <select class="form-select" id="category" name="category">
                                <option value="">全部分类</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat}" 
                                        th:text="${cat}"
                                        th:selected="${cat == selectedCategory}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-search"></i> 搜索
                            </button>
                            <a th:href="@{/skills}" class="btn btn-secondary">
                                <i class="bi bi-arrow-clockwise"></i> 重置
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Skills Count -->
            <div class="mb-3">
                <p class="text-muted">
                    共找到 <strong th:text="${totalItems}">0</strong> 个技能
                </p>
            </div>
            
            <!-- Skills Cards -->
            <div th:if="${#lists.isEmpty(skills)}" class="alert alert-info">
                <i class="bi bi-info-circle"></i> 暂无技能记录，请添加新技能。
            </div>
            
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4">
                <div class="col" th:each="skill : ${skills}">
                    <div class="card h-100 shadow-sm skill-card">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-star-fill text-warning"></i>
                                <span th:text="${skill.name}">技能名称</span>
                            </h5>
                            <h6 class="card-subtitle mb-2">
                                <span class="badge bg-secondary" th:text="${skill.category}">分类</span>
                                <span class="badge" 
                                      th:classappend="${skill.proficiencyLevel.name() == 'BEGINNER' ? 'bg-info' : 
                                                       skill.proficiencyLevel.name() == 'INTERMEDIATE' ? 'bg-primary' :
                                                       skill.proficiencyLevel.name() == 'ADVANCED' ? 'bg-success' : 'bg-danger'}"
                                      th:text="${skill.proficiencyLevel.displayName}">熟练度</span>
                            </h6>
                            <p class="card-text text-muted" th:text="${skill.description}">描述</p>
                            <p class="card-text">
                                <small class="text-muted">
                                    <i class="bi bi-clock-history"></i> 
                                    经验: <span th:text="${skill.yearsOfExperience}">0</span> 年
                                </small>
                            </p>
                        </div>
                        <div class="card-footer bg-transparent">
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/skills/{id}(id=${skill.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> 查看
                                </a>
                                <a th:href="@{/skills/{id}/edit(id=${skill.id})}" class="btn btn-sm btn-outline-warning">
                                    <i class="bi bi-pencil"></i> 编辑
                                </a>
                                <form th:action="@{/skills/{id}/delete(id=${skill.id})}" method="post" 
                                      onsubmit="return confirm('确定要删除这个技能吗？');" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> 删除
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Pagination -->
            <nav th:if="${totalPages > 0}" aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" 
                           th:href="@{/skills(page=${currentPage - 1}, size=${pageSize}, keyword=${keyword}, category=${selectedCategory})}">
                            上一页
                        </a>
                    </li>
                    
                    <li class="page-item" 
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:if="${i >= currentPage - 2 && i <= currentPage + 2}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" 
                           th:href="@{/skills(page=${i}, size=${pageSize}, keyword=${keyword}, category=${selectedCategory})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" 
                           th:href="@{/skills(page=${currentPage + 1}, size=${pageSize}, keyword=${keyword}, category=${selectedCategory})}">
                            下一页
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </main>
    
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
